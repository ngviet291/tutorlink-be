spring.application.name=tutorlink-be
server.servlet.context-path=/api
# DATABASE CONNECTION CONFIGURATION
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:tutorlink-be}?TimeZone=UTC
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASS:sapassword}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

# JPA / HIBERNATE CONFIGURATION
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
logging.level.org.hibernate.orm.persistenceContext=ERROR
