<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Đặt lại mật khẩu</title>
</head>
<body style="font-family: Arial, sans-serif; background:#f5f5f5; padding: 20px;">
<div style="max-width:500px; margin:auto; background:#fff; border-radius:8px; padding:32px;">
    <h2 style="color:#E85D26;">TutorLink</h2>
    <p>Xin chào,</p>
    <p>Mật khẩu của bạn đã được đặt lại thành công. Mật khẩu mới của bạn là:</p>
    <div style="font-size:20px; font-weight:bold; color:#E85D26; text-align:center;
                background:#fff3ee; border-radius:6px; padding:16px; margin:16px 0;">
        {{newPassword}}
    </div>
    <p>Vui lòng đăng nhập và đổi mật khẩu ngay sau khi nhận được email này.</p>
    <p>Nếu bạn không yêu cầu, hãy liên hệ với chúng tôi ngay.</p>
    <hr style="margin:24px 0;">
    <p style="color:#999; font-size:12px;">© 2026 TutorLink</p>
</div>
</body>
</html>
