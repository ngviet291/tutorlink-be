<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TutorLink</title>
</head>
<body style="margin:0;padding:0;background:#f5f5f5;font-family:Arial,Helvetica,sans-serif;color:#222;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="padding:24px 0;">
    <tr>
      <td align="center">
        <table role="presentation" width="560" cellspacing="0" cellpadding="0"
               style="background:#ffffff;border-radius:8px;overflow:hidden;max-width:560px;">
          <tr>
            <td style="background:#f26b21;color:#ffffff;padding:16px 24px;font-size:18px;font-weight:bold;">
              TutorLink
            </td>
          </tr>
          <tr>
            <td style="padding:24px;">
              <h2 style="margin:0 0 12px 0;font-size:18px;">{{title}}</h2>
              <p style="margin:0;font-size:15px;line-height:1.6;">{{content}}</p>
            </td>
          </tr>
          <tr>
            <td style="padding:16px 24px;font-size:12px;color:#888;border-top:1px solid #eee;">
              Đây là email tự động từ TutorLink, vui lòng không trả lời email này.
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
